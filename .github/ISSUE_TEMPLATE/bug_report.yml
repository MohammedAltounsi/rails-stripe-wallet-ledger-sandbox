name: Bug report
description: Something in the ledger, wallet, checkout, or reconciliation doesn't behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, including request params or console commands if relevant.
    validations:
      required: true
  - type: input
    id: invariant
    attributes:
      label: Which invariant does this break, if any
      description: "e.g. \"a wallet went negative\" or \"a webhook redelivery double-credited\". Leave blank if it's not a money-correctness bug."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
