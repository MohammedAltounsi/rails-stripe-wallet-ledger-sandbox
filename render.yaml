# Render Blueprint — Dallah Coffee (Rails 8 + PostgreSQL)
# Web runs on Render; the Postgres database is hosted on Neon (free, persistent)
# and passed in as DATABASE_URL. Deploy: push to GitHub, then New → Blueprint.
services:
  - type: web
    name: dallah-coffee
    runtime: docker
    plan: starter              # always-on (no cold starts) for the live showcase
    region: frankfurt          # closest Render region to Saudi Arabia
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # Thruster listens on the port Render routes to.
      - key: HTTP_PORT
        value: 10000
      # One Puma worker, 3 threads: fits the Starter instance's 512 MB without
      # the memory creep that was OOM-killing (exit 137) a 5-thread worker.
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 3
      # Solid Queue OFF. Its in-Puma supervisor pushed a 512 MB instance over the
      # memory limit (OOM, exit 137); receipt emails use the :async adapter now.
      # Set to "false" (not removed) so a blueprint sync updates the stored value;
      # removing the key would leave the old "true" in place.
      - key: SOLID_QUEUE_IN_PUMA
        value: false
      # jemalloc: reclaim freed pages to the OS quickly and cap arenas, so RSS
      # stays flat instead of climbing to the 512 MB ceiling over time.
      - key: MALLOC_CONF
        value: narenas:2,background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:0
      # Public host for links in receipt emails (set to your onrender.com URL, no protocol).
      - key: APP_HOST
        sync: false
      # From address on receipts, e.g. "Dallah Coffee <receipts@yourdomain.com>".
      - key: MAILER_FROM
        sync: false
      # --- SMTP (any provider). Leave unset to skip sending. See DEPLOY.md. ---
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # --- Secrets: set these in the Render dashboard (sync:false = not in git) ---
      - key: RAILS_MASTER_KEY          # value of config/master.key
        sync: false
      - key: DATABASE_URL              # Neon connection string (…?sslmode=require)
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY    # pk_test_…
        sync: false
      - key: STRIPE_SECRET_KEY         # sk_test_…
        sync: false
      - key: STRIPE_WEBHOOK_SECRET     # whsec_… from the DASHBOARD webhook (not the CLI one)
        sync: false
