<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="title desc">
  <title id="title">Dallah Coffee: a double-entry payments and wallet ledger in Rails 8</title>
  <desc id="desc">The Dallah coffee-pot logo beside the project name, and a ledger card with two real entries from the live demo. Each entry's postings cancel out, and the sum of every balance is SAR 0.00.</desc>
  <rect width="1200" height="416" rx="24" fill="#1b1410"/>
  <g transform="translate(64 56) scale(0.62)">
    <path fill="none" stroke="#f1e8d8" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" d="M75 79 C100 81 108 107 87 116 C80 119 73 114 76 108 C78 104 84 106 82 110"/>
    <path fill="#f1e8d8" d="M45 80 C29 75, 17 66, 15 51 C14 48, 18 47, 20 49 C26 59, 36 69, 50 74 Z"/>
    <path fill="#f1e8d8" d="M44 76 C33 86, 30 106, 37 118 C42 127, 51 131, 60 131 C69 131, 78 127, 83 118 C90 106, 87 86, 76 76 C68 70, 52 70, 44 76 Z"/>
    <path fill="#d4a24c" d="M47 123 C47 130 73 130 73 123 C73 119 47 119 47 123 Z"/>
    <path fill="#f1e8d8" d="M45 74 C45 66, 51 65, 60 65 C69 65, 75 66, 75 74 Z"/>
    <rect x="48" y="59.5" width="24" height="6.5" rx="3.2" fill="#d4a24c"/>
    <path fill="#f1e8d8" d="M51 60 C52 48, 68 48, 69 60 Z"/>
    <rect x="54" y="43.5" width="12" height="4.5" rx="2.2" fill="#d4a24c"/>
    <circle cx="60" cy="40" r="5" fill="#f1e8d8"/>
    <circle cx="60" cy="31" r="3.6" fill="#d4a24c"/>
    <rect x="59" y="22" width="2" height="8" fill="#f1e8d8"/>
    <path fill="#d4a24c" d="M60 10 L62 24 L58 24 Z"/>
    <circle cx="60" cy="9" r="2.1" fill="#f1e8d8"/>
  </g>
  <text x="154" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#d4a24c">RAILS 8 · STRIPE · POSTGRES</text>
  <text x="64" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#f1e8d8">Dallah Coffee</text>
  <text x="64" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#f1e8d8">A payments and wallet ledger where</text>
  <text x="64" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#f1e8d8">every entry sums to zero.</text>
  <text x="64" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">PaymentIntents · signed webhooks · reconciliation</text>
  
  <rect x="704" y="48" width="432" height="320" rx="18" fill="#251c16" stroke="#4a3a2e" stroke-width="1.5"/>
  <text x="728" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#d4a24c">LEDGER · LIVE DEMO</text>
  <text x="728" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f1e8d8">stripe topup</text>
  <text x="744" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">stripe:cash</text>
  <text x="1112" y="158" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">−SAR 25.00</text>
  <text x="744" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">wallet:layla</text>
  <text x="1112" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f1e8d8">+SAR 25.00</text>
  <path d="M734 140 V192" stroke="#d4a24c" stroke-width="2"/>
  <text x="728" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f1e8d8">wallet order DAL-9IBNTTW1</text>
  <text x="744" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">wallet:layla</text>
  <text x="1112" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">−SAR 18.00</text>
  <text x="744" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#b3a493">revenue:coffee</text>
  <text x="1112" y="280" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f1e8d8">+SAR 18.00</text>
  <path d="M734 236 V288" stroke="#d4a24c" stroke-width="2"/>
  <path d="M728 304 H1112" stroke="#f1e8d8" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="728" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f1e8d8">Sum of every balance</text>
  <text x="1112" y="352" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#d4a24c">SAR 0.00</text>
</svg>
